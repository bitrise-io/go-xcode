format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  check:
    before_run:
    - test
    - integration_test

  test:
    steps:
    - script:
        title: golangci-lint
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s v2.11.4
            ./bin/golangci-lint run
    - go-list:
        inputs:
        - exclude: "*/mocks"
    - go-test: { }

  integration_test:
    steps:
    - change-workdir:
        inputs:
        - path: ./_integration_tests
    - go-list: { }
    - go-test: { }
    - change-workdir:
        inputs:
        - path: ..
