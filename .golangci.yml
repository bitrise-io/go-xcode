version: "2"

linters:
  enable:
  - revive

  settings:
    revive:
      severity: error
      rules:
      - name: exported
        arguments:
        - checkPrivateReceivers

  exclusions:
    paths:
    - (^|/)mocks/
    rules:
    - linters:
      - staticcheck
      text: QF1003 # https://staticcheck.dev/docs/checks#QF1003
    # Explicit selectors show which embedded struct a field belongs to.
    - linters:
      - staticcheck
      text: QF1008
    # Error strings open with product and file names (Apple, App Store Connect, Info.plist).
    - linters:
      - staticcheck
      text: ST1005
    # Renaming an exported error var breaks every caller that matches on it.
    - linters:
      - staticcheck
      text: ST1012
